name: Personal desktop builds

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: personal-desktop-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'peterxiemin/t3code' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout -B main FETCH_HEAD
      - name: Merge upstream main
        if: github.event_name != 'push'
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none --unshallow origin main
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags --filter=blob:none upstream main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before=$(git rev-parse HEAD)
          git merge --no-edit FETCH_HEAD
          if [[ "$before" == "$(git rev-parse HEAD)" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies for merged code
        if: steps.merge.outputs.changed == 'true'
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3...
      - name: Verify tool schema before syncing
        if: steps.merge.outputs.changed == 'true'
        working-directory: apps/server
        run: vp test run src/mcp/advertisedJsonSchema.test.ts
      - name: Push the tested merge
        if: steps.merge.outputs.changed == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.PERSONAL_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/main
      - name: Select build
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED: ${{ steps.merge.outputs.changed }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=${version}-nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == 'schedule' && "$CHANGED" != 'true' ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  bundle:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        shell: bash
        env:
          CHECKOUT_REF: ${{ needs.prepare.outputs.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - name: Check Antigravity tool schema
        working-directory: apps/server
        run: vp test run src/mcp/advertisedJsonSchema.test.ts
      - name: Align package versions
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$BUILD_VERSION"
      - name: Build desktop bundle
        env:
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop:
    needs: [prepare, bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
      release_channel: nightly
      relay_client_tracing: false
      launch_check: true
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""

  release:
    needs: [prepare, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: packages
          merge-multiple: true
      - name: Verify Linux update metadata
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test -f packages/nightly-linux.yml
          grep -Fx "version: $BUILD_VERSION" packages/nightly-linux.yml
          grep -F '.AppImage' packages/nightly-linux.yml
          grep -F 'sha512:' packages/nightly-linux.yml
      - name: Publish personal preview
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v$BUILD_VERSION" packages/* \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --prerelease \
            --title "Personal T3 Code $BUILD_VERSION" \
            --notes 'Personal build. Linux and macOS check this repository for updates. macOS packages are unsigned and not notarized.'
